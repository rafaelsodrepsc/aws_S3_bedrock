[project]
name = "do-bucket-a-ia"
version = "0.1.0"
description = "Demo do minicurso Do bucket à IA: upload seguro no S3 e perguntas com fonte no Bedrock"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.44.3",
    "fastapi>=0.163.1",
    "mangum>=0.22.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "cfn-lint>=1.60.1",
    "httpx>=0.28.1",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
