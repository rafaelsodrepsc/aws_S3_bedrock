<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envie seu PDF | Do bucket à IA</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23FF9900%27/%3E%3Cpath d=%27M11 21 21 11M13 11h8v8%27 stroke=%27%23111827%27 stroke-width=%273%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
</head>
<body class="upload-page">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span> Do bucket à IA</div>
    <nav class="tabs" aria-label="Telas da demo"><a href="/" aria-current="page">Enviar PDF</a><a href="/admin">Moderação</a><a href="/chat">Perguntas</a></nav>
  </header>
  <main class="upload-main">
    <section class="card upload-card" aria-labelledby="title">
      <h1 id="title">Envie um PDF para a IA ler</h1>
      <p class="lead">Ele vai para a base do minicurso, e depois você vê a IA responder com base nele.</p>
      <label class="drop-zone" id="drop-zone" for="file">
        <span class="drop-icon" aria-hidden="true">↑</span>
        <strong>Toque para escolher o PDF</strong>
        <span class="meta" id="file-help">ou arraste o arquivo para cá. Só PDF, até 5 MB.</span>
        <input type="file" id="file" accept="application/pdf,.pdf" aria-describedby="file-help file-details">
      </label>
      <p id="file-details" class="file-details" aria-live="polite">Nenhum arquivo escolhido.</p>
      <button id="send" class="primary" disabled>Enviar PDF</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
    <p class="footer-note">O apresentador confere cada arquivo antes de ele entrar na base.</p>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const fileInput = document.getElementById('file');
    const sendButton = document.getElementById('send');
    const fileDetails = document.getElementById('file-details');
    const dropZone = document.getElementById('drop-zone');
    let auth = null;
    let selectedFile = null;
    let selection = 0;
    let uploading = false;

    function showStatus(text, state) {
      statusEl.textContent = text;
      statusEl.dataset.state = state;
    }

    async function selectFile(file) {
      if (uploading) return;
      const version = ++selection;
      auth = null;
      selectedFile = file || null;
      sendButton.disabled = true;
      fileDetails.textContent = file
        ? `${file.name} (${(file.size / 1024 / (file.size >= 1048576 ? 1024 : 1)).toFixed(1)} ${file.size >= 1048576 ? 'MB' : 'KB'})`
        : 'Nenhum arquivo escolhido.';
      fileDetails.classList.toggle('chosen', Boolean(file));
      if (!file) { showStatus('', 'info'); return; }
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        showStatus('Escolha um arquivo PDF.', 'error');
        return;
      }
      // A autorização começa na escolha para preservar a demo com ?ttl=10.
      showStatus('Pedindo autorização...', 'loading');
      const params = new URLSearchParams(location.search);
      params.set('name', file.name);
      try {
        const res = await fetch(`/upload-url?${params}`, { method: 'POST' });
        if (!res.ok) throw new Error(`Falha ao pedir autorização (${res.status})`);
        const data = await res.json();
        if (version !== selection) return;
        auth = data;
        sendButton.disabled = false;
        showStatus('Pronto para enviar.', 'success');
      } catch (error) {
        if (version !== selection) return;
        auth = null;
        showStatus(error.message, 'error');
      }
    }

    fileInput.onchange = () => selectFile(fileInput.files[0]);
    dropZone.ondragover = (event) => {
      event.preventDefault();
      if (!uploading) dropZone.classList.add('dragging');
    };
    dropZone.ondragleave = () => dropZone.classList.remove('dragging');
    dropZone.ondrop = (event) => {
      event.preventDefault();
      dropZone.classList.remove('dragging');
      if (!uploading) {
        fileInput.value = '';
        selectFile(event.dataTransfer.files[0]);
      }
    };

    sendButton.onclick = async () => {
      if (uploading) return;
      if (!selectedFile || !auth) { showStatus('Escolha um PDF.', 'info'); return; }
      const form = new FormData();
      Object.entries(auth.fields).forEach(([key, value]) => form.append(key, value));
      form.append('file', selectedFile); // O arquivo precisa ser o último campo.
      uploading = true;
      sendButton.disabled = true;
      fileInput.disabled = true;
      showStatus('Enviando documento...', 'loading');
      try {
        const up = await fetch(auth.url, { method: 'POST', body: form });
        if (up.ok) {
          auth = null;
          selectedFile = null;
          fileInput.value = '';
          fileDetails.textContent = 'Nenhum arquivo escolhido.';
          fileDetails.classList.remove('chosen');
          showStatus('Recebido! Ele entra na base depois que o apresentador aprovar.', 'success');
        } else {
          showStatus(`O S3 recusou o envio (${up.status}): arquivo grande demais ou autorização expirada.`, 'error');
        }
      } catch {
        showStatus('Falha de rede ao enviar.', 'error');
      } finally {
        uploading = false;
        fileInput.disabled = false;
        sendButton.disabled = !auth;
      }
    };
  </script>
</body>
</html>
